<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | UniForge</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>

    
    <main class="profile-page">
        <div class="container">
            <div class="profile-header">
                <div class="profile-avatar" aria-label="Profile avatar">
                    <svg viewBox="0 0 24 24" width="48" height="48"
                        fill="currentColor" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 21v-2c0-4.5 3.5-7 8-7s8 2.5 8 7v2z"/>
                    </svg>
                </div>

                <div class="profile-details">
                    <h1 id="profile-name">Student Name</h1>
                    <p id="profile-university">SDU University</p>
                    <span class="profile-role" id="profile-role">
                        Frontend Developer
                    </span>
                </div>

                <button class="btn btn-primary" id="edit-profile-btn">
                    Edit Profile
                </button>
            </div>

            <div class="profile-grid">

                <section class="profile-card">
                    <h2>About Me</h2>
                    <p id="profile-about">
                        Passionate university student interested in
                        software development, hackathons, and building
                        innovative projects with talented teammates.
                    </p>
                </section>

                <section class="profile-card">
                    <h2>Technical Skills</h2>

                    <div class="skills-list" id="profile-skills">
                        <span class="skill-tag">C++</span>
                        <span class="skill-tag">Python</span>
                        <span class="skill-tag">JavaScript</span>
                        <span class="skill-tag">HTML</span>
                        <span class="skill-tag">CSS</span>
                    </div>
                </section>

            </div>

        </div>
    </main>


    <!-- Edit Profile Modal -->
    <div class="edit-modal hidden" id="edit-modal">
        <div class="edit-modal-content" role="dialog"
            aria-modal="true" aria-labelledby="edit-modal-title">

            <div class="edit-modal-header">
                <h2 id="edit-modal-title">Edit Profile</h2>
                <button type="button" id="close-edit-modal"
                        aria-label="Close dialog">&times;</button>
            </div>

            <form id="edit-profile-form">

                <div class="edit-form-group">
                    <label for="edit-name">Full Name</label>
                    <input type="text" id="edit-name" required maxlength="100">
                </div>

                <div class="edit-form-group">
                    <label for="edit-university">University</label>
                    <input type="text" id="edit-university" required maxlength="100">
                </div>

                <div class="edit-form-group">
                    <label for="edit-role">Role / Specialization</label>
                    <input type="text" id="edit-role" required maxlength="100">
                </div>

                <div class="edit-form-group">
                    <label for="edit-about">About Me</label>
                    <textarea id="edit-about" rows="4" maxlength="1000"></textarea>
                </div>

                <div class="edit-form-group">
                    <label for="edit-skills">Technical Skills</label>
                    <input type="text" id="edit-skills"
                        placeholder="C++, Python, JavaScript">
                    <small>Separate skills with commas.</small>
                </div>

                <div class="edit-form-actions">
                    <button type="button" class="btn btn-secondary"
                            id="cancel-edit">
                        Cancel
                    </button>

                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>
                </div>

            </form>
        </div>
    </div>



    <script src="profile.js"></script>
</body>
</html>
